[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "euronext-portfolio-decision-engine"
version = "0.1.0"
description = "Weekly multidimensional equity research and portfolio decision engine for the Euronext universe."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scipy>=1.14",
]

[project.scripts]
epde = "euronext_pde.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/euronext_pde"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"